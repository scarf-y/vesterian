[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vesterian"
version = "0.1.0"
description = "Discord lookups for the Vesteria Database"
requires-python = ">=3.11"
dependencies = ["discord.py>=2.6,<3", "aiohttp>=3.12,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.11"]

[project.scripts]
vesterian = "vesterian.bot:main"

[tool.setuptools.packages.find]
include = ["vesterian*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore:'count' is passed as positional argument:DeprecationWarning:discord.utils"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
